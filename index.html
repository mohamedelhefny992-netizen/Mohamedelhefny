<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4eee3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مسارك">
<link rel="manifest" href="manifest.json">
<title>مسارك | المهام</title>
<style>
:root{--bg:#f4eee3;--paper:#fbf8f1;--ink:#3c3427;--muted:#9b8e78;--line:#e9dfcc;--accent:#c96f48;--green:#7d9b62;--blue:#4d83c9;--gold:#d5a16c;--red:#c94c4c;--shadow:0 12px 32px #59462a0d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:820px;margin:auto;padding:22px 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 2px 24px}
.brand small{display:block;color:var(--muted);font-weight:700;letter-spacing:2px;font-size:13px}.brand h1{font-size:38px;margin:2px 0 0;letter-spacing:-1px}
.dua{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:14px 18px;color:#b5a78e;text-align:center;font-size:14px;margin-bottom:22px;box-shadow:var(--shadow)}
.progress-wrap{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:700;margin:10px 5px 8px}
.progress{height:8px;border-radius:99px;background:#e4d8c3;overflow:hidden;margin:0 4px 24px}.progress>span{height:100%;width:0;background:var(--accent);display:block;border-radius:99px;transition:width .25s}
.tabs{display:flex;gap:24px;overflow:auto;white-space:nowrap;border-bottom:1px solid #dfd2bd;padding:0 4px 12px;margin-bottom:20px}
.tab{border:0;background:none;color:var(--muted);font-weight:800;padding:8px 2px;position:relative}.tab.active{color:var(--ink)}.tab.active:after{content:"";position:absolute;bottom:-13px;right:0;left:0;height:4px;background:var(--accent);border-radius:9px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:12px 3px}.section-head h2{font-size:18px;margin:0}.sub{color:var(--muted);font-size:13px}
.task-list{display:grid;gap:13px}
.task{background:var(--paper);border:1px solid #eee5d5;border-radius:27px;padding:16px 15px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;box-shadow:var(--shadow);transition:.2s}
.task.done{opacity:.68}.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.complete{width:34px;height:34px;border:2px solid var(--accent);border-radius:50%;background:transparent;color:white;display:grid;place-items:center;font-size:20px;font-weight:900;flex-shrink:0}
.task.done .complete{background:var(--green);border-color:var(--green)}
.task-title{font-size:18px;font-weight:800;line-height:1.4;overflow-wrap:anywhere}.task-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.tag{padding:4px 9px;border-radius:99px;background:#f2eadc}
.task-actions{display:flex;gap:7px;align-items:center}.icon-btn{border:0;background:transparent;color:#94866f;font-size:19px;padding:7px;border-radius:12px}.icon-btn:active{background:#eee3d1}
.side-mark{width:6px;height:48px;border-radius:9px;background:var(--line);margin-right:2px}.task.done .side-mark{background:var(--green)}
.empty{padding:38px 15px;text-align:center;color:var(--muted);background:#fbf8f188;border:1px dashed #ddcfb9;border-radius:24px;line-height:1.8}
.fab{position:fixed;bottom:calc(25px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:76px;height:76px;border:0;border-radius:27px;background:var(--accent);color:white;font-size:44px;box-shadow:0 14px 28px #c96f4840;z-index:5}
.modal-back{position:fixed;inset:0;background:#211b15a6;display:none;align-items:flex-end;justify-content:center;z-index:10;padding:12px}.modal-back.show{display:flex}
.modal{background:var(--paper);width:min(100%,620px);border-radius:28px 28px 20px 20px;padding:22px;max-height:92dvh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:23px}.close{border:0;background:#f0e8da;border-radius:50%;width:36px;height:36px;font-size:20px;color:var(--ink)}
.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:13px;font-weight:800;margin:0 3px 7px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#f6f0e5;border-radius:16px;padding:14px;color:var(--ink);outline:none}
.field textarea{min-height:76px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors{display:flex;gap:9px;flex-wrap:wrap}.color-choice{border:2px solid transparent;border-radius:99px;padding:8px 12px;background:#f1e9dc;color:var(--ink);font-weight:700}.color-choice.selected{border-color:var(--accent);background:#f4dfcf}
.save{width:100%;border:0;background:var(--accent);color:#fff;padding:16px;border-radius:19px;font-weight:900;font-size:17px;margin-top:12px}
.secondary{background:#eee5d6;color:var(--ink)}
.toast{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:11px 17px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap}.toast.show{opacity:1}
@media(min-width:650px){.app{padding-top:35px}.task{padding:19px 22px}.fab{left:auto;right:max(calc((100vw - 780px)/2),24px);transform:none}}
</style>
</head>
<body>
<main class="app">
  <div class="dua">اللهم إني أعوذ بك من الكسل والهم والحزن والعجز</div>
  <header class="top">
    <div class="brand"><small>MASARAK</small><h1>المهــمات</h1></div>
    <button class="icon-btn" id="clearDone" title="حذف المكتملة">⋯</button>
  </header>
  <div class="progress-wrap"><span id="progressText">٠٪ مكتمل</span><span id="countText">٠ من ٠</span></div>
  <div class="progress"><span id="progressBar"></span></div>
  <nav class="tabs" aria-label="عرض المهام">
    <button class="tab active" data-view="today">اليوم</button>
    <button class="tab" data-view="tomorrow">غدًا</button>
    <button class="tab" data-view="later">لاحقًا</button>
    <button class="tab" data-view="all">كل المهام</button>
    <button class="tab" data-view="done">المكتملة ✓</button>
  </nav>
  <div class="section-head"><h2 id="listTitle">مهام اليوم</h2><span class="sub" id="dateLabel"></span></div>
  <section class="task-list" id="taskList"></section>
</main>
<button class="fab" id="addBtn" aria-label="إضافة مهمة">+</button>
<div class="modal-back" id="modalBack">
  <form class="modal" id="taskForm">
    <div class="modal-head"><h2 id="modalTitle">مهمة جديدة</h2><button type="button" class="close" id="closeModal">×</button></div>
    <input type="hidden" id="taskId">
    <div class="field"><label for="taskName">ما الذي تريد إنجازه؟</label><input id="taskName" maxlength="100" placeholder="اكتب مهمتك هنا..." required></div>
    <div class="two">
      <div class="field"><label for="taskDate">التاريخ</label><input id="taskDate" type="date" required></div>
      <div class="field"><label for="taskTime">الوقت</label><input id="taskTime" type="time"></div>
    </div>
    <div class="two">
      <div class="field"><label for="taskCategory">التصنيف</label><select id="taskCategory"><option>بدون</option><option>عمل</option><option>دراسة</option><option>شخصي</option><option>عبادة</option><option>صحة</option></select></div>
      <div class="field"><label for="taskPriority">الأهمية</label><select id="taskPriority"><option value="عادية">عادية</option><option value="مهمة">مهمة</option><option value="عاجلة">عاجلة 🔥</option></select></div>
    </div>
    <div class="field"><label for="taskGoal">الهدف المرتبط (اختياري)</label><input id="taskGoal" placeholder="مثلاً: تطوير نفسي"></div>
    <div class="field"><label for="taskNote">ملاحظات (اختياري)</label><textarea id="taskNote" placeholder="أي تفاصيل إضافية..."></textarea></div>
    <button class="save" type="submit">حفظ المهمة ✓</button>
  </form>
</div>
<div class="toast" id="toast"></div>
<script>
const KEY='masarak_tasks_v1';
let tasks=JSON.parse(localStorage.getItem(KEY)||'[]');
let view='today';
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const tomorrow=()=>{const d=new Date();d.setDate(d.getDate()+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const colors={'عمل':'#4d83c9','دراسة':'#d5a16c','شخصي':'#c96f48','عبادة':'#7d9b62','صحة':'#c94c4c','بدون':'#c96f48'};
const fmtDate=s=>{if(!s)return '';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}
function render(){
 const completed=tasks.filter(t=>t.done).length, total=tasks.length, pct=total?Math.round(completed/total*100):0;
 $('progressText').textContent=`${pct}٪ مكتمل`;$('countText').textContent=`${completed} من ${total}`;$('progressBar').style.width=pct+'%';
 $('dateLabel').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
 const titles={today:'مهام اليوم',tomorrow:'مهام غدًا',later:'مهام لاحقًا',all:'كل المهام',done:'المهام المكتملة'};$('listTitle').textContent=titles[view];
 let arr=tasks.filter(t=>view==='all'?true:view==='done'?t.done:view==='today'?t.date===today()&&!t.done:view==='tomorrow'?t.date===tomorrow()&&!t.done:t.date>tomorrow()&&!t.done);
 arr.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 $('taskList').innerHTML='';
 if(!arr.length){$('taskList').innerHTML=`<div class="empty">مفيش مهام هنا حاليًا 🌿<br>اضغط على علامة + لإضافة مهمة جديدة</div>`;return}
 arr.forEach(t=>{
  const el=document.createElement('article');el.className='task'+(t.done?' done':'');
  const meta=[t.time||'',fmtDate(t.date),t.category||'بدون',t.priority||'عادية'].filter(Boolean);
  el.innerHTML=`<button class="complete" aria-label="${t.done?'إلغاء الإتمام':'إتمام المهمة'}">${t.done?'✓':''}</button>
   <div><div class="task-title"></div><div class="task-meta"><span class="dot" style="background:${colors[t.category]||colors['بدون']}"></span>${meta.map(x=>`<span class="tag">${x}</span>`).join('')}</div>${t.goal?`<div class="sub" style="margin-top:7px">الهدف: ${escapeHtml(t.goal)}</div>`:''}</div>
   <div class="task-actions"><button class="icon-btn edit" aria-label="تعديل">✎</button><button class="icon-btn del" aria-label="حذف">⌫</button><div class="side-mark"></div></div>`;
  el.querySelector('.task-title').textContent=t.name;
  el.querySelector('.complete').onclick=()=>{t.done=!t.done;t.completedAt=t.done?Date.now():null;save();toast(t.done?'أحسنت! تم إتمام المهمة ✓':'تم إلغاء الإتمام')};
  el.querySelector('.edit').onclick=()=>openModal(t);
  el.querySelector('.del').onclick=()=>{if(confirm('هل تريد حذف هذه المهمة؟')){tasks=tasks.filter(x=>x.id!==t.id);save();toast('تم حذف المهمة')}};
  $('taskList').appendChild(el);
 });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(t=null){
 $('taskForm').reset();$('taskId').value=t?.id||'';$('modalTitle').textContent=t?'تعديل المهمة':'مهمة جديدة';
 $('taskName').value=t?.name||'';$('taskDate').value=t?.date||today();$('taskTime').value=t?.time||'';
 $('taskCategory').value=t?.category||'بدون';$('taskPriority').value=t?.priority||'عادية';$('taskGoal').value=t?.goal||'';$('taskNote').value=t?.note||'';
 $('modalBack').classList.add('show');setTimeout(()=>$('taskName').focus(),100)
}
function closeModal(){$('modalBack').classList.remove('show')}
$('addBtn').onclick=()=>openModal();$('closeModal').onclick=closeModal;
$('modalBack').onclick=e=>{if(e.target===$('modalBack'))closeModal()};
$('taskForm').onsubmit=e=>{e.preventDefault();const id=$('taskId').value;const old=tasks.find(t=>t.id===id);const obj={id:id||String(Date.now()),name:$('taskName').value.trim(),date:$('taskDate').value,time:$('taskTime').value,category:$('taskCategory').value,priority:$('taskPriority').value,goal:$('taskGoal').value.trim(),note:$('taskNote').value.trim(),done:old?.done||false,completedAt:old?.completedAt||null};if(!obj.name)return;if(old)Object.assign(old,obj);else tasks.push(obj);save();closeModal();toast(old?'تم تعديل المهمة':'تمت إضافة المهمة ✓')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
$('clearDone').onclick=()=>{if(tasks.some(t=>t.done)&&confirm('حذف كل المهام المكتملة؟')){tasks=tasks.filter(t=>!t.done);save();toast('تم حذف المهام المكتملة')}else if(!tasks.some(t=>t.done))toast('لا توجد مهام مكتملة')};
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
